apiVersion: v1
kind: ServiceAccount
metadata: {name: hospital, namespace: {{ .Release.Namespace }}}
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: hospital-default-deny, namespace: {{ .Release.Namespace }}}
spec:
  podSelector: {matchLabels: {part-of: hospital}}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: hospital-internal, namespace: {{ .Release.Namespace }}}
spec:
  podSelector: {matchLabels: {part-of: hospital}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {part-of: hospital}}
      ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: hospital-ingress, namespace: {{ .Release.Namespace }}}
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
      ports: [{port: 8080}]
{{- if gt (int .Values.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: hospital-gateway, namespace: {{ .Release.Namespace }}}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: api-gateway}}
{{- end }}
