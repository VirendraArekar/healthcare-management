name: security-scan
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - run: docker run --rm -v "$PWD:/src" aquasec/trivy:0.76.1 fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 /src
      - run: cd frontend && npm ci && npm audit --audit-level=high
